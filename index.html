<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#141a33" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Drop Rush : Battle Royale 3D multijoueur gratuit, jouable directement dans le navigateur." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Drop Rush</title>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
    <div id="boot-loader">
      <div class="logo"><span>DROP</span><span>RUSH</span></div>
      <div class="boot-progress"><i></i></div>
      <div class="boot-label">Chargement…</div>
    </div>
    <noscript>
      <div class="fatal-screen"><div class="fatal-card"><h1>JavaScript désactivé</h1><p>Activez JavaScript pour jouer à Drop Rush.</p></div></div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
